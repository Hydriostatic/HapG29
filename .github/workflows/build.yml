# Compila o g29haptic.exe na nuvem do GitHub (Windows + Visual Studio).
# O .exe aparece em Actions -> última execução -> Artifacts -> g29haptic.
name: build

on:
  push:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar, compilar e testar
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $log = "build-log.txt"
          cmake -S . -B build -A x64 *>&1 | Tee-Object -FilePath $log
          if ($LASTEXITCODE -eq 0) { cmake --build build --config Release *>&1 | Tee-Object -FilePath $log -Append }
          if ($LASTEXITCODE -eq 0) { ctest --test-dir build -C Release --output-on-failure *>&1 | Tee-Object -FilePath $log -Append }
          $rc = $LASTEXITCODE
          if ($rc -ne 0) {
            # Publica as linhas de erro como anotações (visíveis sem baixar o log).
            $lines = Get-Content $log | Select-String -Pattern 'error|CMake Error|FAILED|FAIL ' | Select-Object -First 25
            if (-not $lines) { $lines = Get-Content $log | Select-Object -Last 25 }
            foreach ($l in $lines) { Write-Output ("::error::" + ($l.ToString() -replace '%','%25')) }
          }
          exit $rc

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: g29haptic
          path: |
            build/Release/g29haptic.exe
            README.md
